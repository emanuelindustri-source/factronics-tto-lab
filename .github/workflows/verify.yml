name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify bank, versions, i18n, links and APK
        run: python tools/verify.py

      - name: Check UI dictionary is in sync
        run: node tools/export_ui.js --check
